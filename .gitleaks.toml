  # WorkflowSecretScannerTests.cs
  '''^AIzaSyA1234567890abcdefghijklmnopqrstu$''',
  # NativeCredentialEnvironmentTests.cs
  '''^ApiKeyVariable=variable$''',
  # ActivityCenterRedactionBoundaryTests.cs, ActivityLoadEventFactory.cs
  '''^Hunter2Correct-Horse-Battery$''',
  # ActivityCenterRedactionBoundaryTests.cs, ActivityLoadEventFactory.cs
